<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prompt → JSON Enhancer</title>
  <style>
    body {
      background: #0f1724;
      color: #e6eef8;
      font-family: sans-serif;
      padding: 10px;
      margin: 0;
      width: 320px;
    }
    h1 { font-size: 16px; margin-bottom: 10px; }
    label { font-size: 13px; display: block; margin-top: 8px; }
    textarea, pre {
      width: 100%;
      background: #1e293b;
      color: #fff;
      border-radius: 6px;
      border: 1px solid #334155;
      padding: 8px;
      box-sizing: border-box;
      font-size: 13px;
      resize: vertical;
    }
    button {
      margin-top: 6px;
      margin-right: 4px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #7c3aed;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    select {
      margin-top: 6px;
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
    }
    pre {
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
    .accordion {
      margin-top: 10px;
    }
    .accordion button {
      background: #334155;
      width: 100%;
      text-align: left;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .accordion-content {
      display: none;
      margin-top: 6px;
    }
    .accordion-content input {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 8px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Prompt → JSON Enhancer</h1>

  <label for="prompt">Original Prompt</label>
  <textarea id="prompt" placeholder="Paste your raw prompt here..."></textarea>

  <label for="complexity">Detail Level</label>
  <select id="complexity">
    <option value="balanced">Balanced</option>
    <option value="low">Low detail</option>
    <option value="high">High detail</option>
  </select>

  <label for="schema">Schema</label>
  <select id="schema">
    <option value="general">General</option>
    <option value="chat_api">Chat API</option>
    <option value="openai_function">OpenAI Function</option>
  </select>

  <div>
    <button id="enhance">Enhance → JSON</button>
    <button id="clear">Clear</button>
    <button id="copy">Copy</button>
    <button id="download">Download</button>
  </div>

  <pre id="output">{"result": "JSON will appear here"}</pre>

  <!-- Accordion for editing fields -->
  <div class="accordion">
    <button id="toggle-fields">▼ Edit Fields</button>
    <div class="accordion-content" id="fields">
      <label>Title</label>
      <input id="field-title" type="text">
      <label>Audience</label>
      <input id="field-audience" type="text">
      <label>Tone</label>
      <input id="field-tone" type="text">
      <label>Constraints</label>
      <input id="field-constraints" type="text">
      <button id="apply-fields">Apply Changes</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
